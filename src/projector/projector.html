<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob: mediastream:"
    />
    <title>Diffusion Écran — Projection</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
      }
      /* Cadre = zone affichée (image entière ou zone recadrée), centrée. */
      #frame {
        position: absolute;
        overflow: hidden;
      }
      video {
        position: absolute;
        display: block;
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <div id="frame"><video id="video" autoplay muted playsinline></video></div>
    <script src="../capture.js"></script>
    <script src="projector.js"></script>
  </body>
</html>
