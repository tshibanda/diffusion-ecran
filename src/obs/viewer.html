<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Diffusion Écran — OBS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video,
      img,
      canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1920" height="1080" hidden></canvas>
    <video id="video" autoplay playsinline></video>
    <img id="fallback" alt="" hidden />
    <script>
      // Image + son en direct (lu au fur et à mesure), en restant au plus près
      // du direct : H.264 (MP4) si possible, sinon VP8 (WebM), sinon image
      // seule (MJPEG).
      const FORMATS = [
        { url: "/live.mp4", type: 'video/mp4; codecs="avc1.64002A,opus"' },
        { url: "/live.webm", type: 'video/webm; codecs="vp8,opus"' },
      ];
      const tried = new URLSearchParams(location.search).get("format");
      // Lancement de l'application qui a servi cette page (voir server.js).
      const BOOT_ID = "__BOOT_ID__";
      // Lecture fluide : on garde un petit tampon régulier et on le maintient en
      // accélérant ou ralentissant imperceptiblement la lecture, sans sauter
      // (chaque saut se voit). On ne saute que très en retard.
      // La vidéo arrive par blocs (un par image clé) : le tampon doit toujours
      // dépasser la taille d'un bloc, sinon la lecture rattrape la fin des
      // données et le lecteur jette les images du bloc suivant, déjà en retard
      // (saccades). Ce retard visé s'adapte à la taille réelle des blocs.
      // Retard imposé possible dans l'adresse : http://127.0.0.1:8765/?retard=2
      const forcedDelay = Number(new URLSearchParams(location.search).get("retard")) || 0;
      let targetDelay = forcedDelay || 1.2;
      const recentSteps = [];
      const FAST = 1.05;
      const SLOW = 0.97;
      const JUMP_DELAY = 3; // au-delà, on rejoint le direct d'un coup
      const KEEP = 10; // secondes de vidéo gardées en mémoire
      const video = document.getElementById("video");

      function fallback() {
        video.hidden = true;
        const img = document.getElementById("fallback");
        img.hidden = false;
        img.src = "/flux.mjpg?" + Date.now();
      }

      function start() {
        const usable = FORMATS.filter((f) => window.MediaSource && MediaSource.isTypeSupported(f.type));
        // Après un échec en H.264, on passe au format suivant.
        const format = tried === "webm" ? usable.find((f) => f.url === "/live.webm") : usable[0];
        if (!format) return fallback();
        const media = new MediaSource();
        video.src = URL.createObjectURL(media);
        media.addEventListener("sourceopen", async () => {
          // Horodatage d'origine des images (mode « segments » par défaut) : le
          // mode « sequence » recolle chaque bloc après le précédent et, avec le
          // son et l'image en blocs séparés, tasse les images (saccades).
          const buffer = media.addSourceBuffer(format.type);
          let played = false;
          video.addEventListener("playing", () => (played = true), { once: true });
          buffer.addEventListener("error", () => {
            if (!played && format.url === "/live.mp4") location.search = "?format=webm";
          });
          const queue = [];
          let lastEnd = 0;
          const pump = () => {
            if (buffer.updating || !queue.length) return;
            // Libère la vidéo déjà jouée (au-delà de KEEP secondes).
            const oldest = buffer.buffered.length ? buffer.buffered.start(0) : 0;
            if (video.currentTime - KEEP > oldest + 1) {
              buffer.remove(0, video.currentTime - KEEP);
              return;
            }
            buffer.appendBuffer(queue.shift());
          };
          buffer.addEventListener("updateend", () => {
            if (buffer.buffered.length) {
              const end = buffer.buffered.end(buffer.buffered.length - 1);
              const step = end - lastEnd;
              lastEnd = end;
              if (!forcedDelay && step > 0.02 && step < 5) {
                recentSteps.push(step);
                if (recentSteps.length > 8) recentSteps.shift();
                targetDelay = Math.min(3, Math.max(0.6, Math.max(...recentSteps) * 1.3 + 0.25));
              }
              // Démarrage (ou très en retard) : on se place au bon retard.
              if (!played || end - video.currentTime > JUMP_DELAY) {
                if (end > targetDelay) video.currentTime = end - targetDelay;
              }
              if (video.paused && end - video.currentTime >= targetDelay / 2) {
                video.play().catch(() => {});
              }
            }
            pump();
          });
          try {
            const response = await fetch(format.url, { cache: "no-store" });
            const reader = response.body.getReader();
            for (;;) {
              const { value, done } = await reader.read();
              if (done) break;
              queue.push(value);
              pump();
            }
          } catch {
            // Application fermée ou redémarrée.
          }
          // Flux coupé : on se reconnecte dès que l'application répond.
          streamEnded = true;
        });
      }

      // Images manquantes (ordinateur chargé) : on saute le trou au lieu de
      // rester figé.
      // Régulation du retard, et trou dans la vidéo (images manquantes) : on le
      // franchit seulement si la lecture est réellement bloquée.
      let lastTime = -1;
      let stuckSince = 0;
      setInterval(() => {
        if (!video.buffered.length) return;
        const end = video.buffered.end(video.buffered.length - 1);
        const delay = end - video.currentTime;
        // Le retard oscille d'un bloc à l'autre : on ne corrige que la tendance.
        video.playbackRate =
          delay > targetDelay + 0.6 ? FAST : delay < targetDelay - 0.6 ? SLOW : 1;

        const now = performance.now();
        if (video.paused || video.currentTime !== lastTime) {
          lastTime = video.currentTime;
          stuckSince = now;
          return;
        }
        if (now - stuckSince < 400) return;
        for (let i = 0; i < video.buffered.length; i++) {
          const startOf = video.buffered.start(i);
          if (startOf > video.currentTime) {
            video.currentTime = startOf + 0.02;
            break;
          }
        }
        stuckSince = now;
      }, 100);

      // Rechargement automatique (jamais pendant que l'application est fermée,
      // sinon OBS resterait bloqué sur une page d'erreur) :
      //  - l'application a redémarré ou a été mise à jour → nouvelle page ;
      //  - le flux s'est arrêté (changement de qualité…) → on se reconnecte.
      let streamEnded = false;
      setInterval(async () => {
        try {
          const response = await fetch("/version", { cache: "no-store" });
          const { boot } = await response.json();
          if (boot !== BOOT_ID || streamEnded) location.reload();
        } catch {
          // Application fermée : on réessaie plus tard.
        }
      }, 2000);

      // --- Lecture directe (WebCodecs) -------------------------------------------
      // Chaque image arrive encodée, est décodée aussitôt puis affichée à son
      // heure, avec une petite réserve qui absorbe les irrégularités d'arrivée.
      // Contrairement au lecteur vidéo classique (MSE, fait pour des fichiers
      // mis en mémoire), rien n'est jeté : c'est ce qui rend l'image fluide.
      const DIRECT_DELAY_MS = 150; // réserve de départ
      const DIRECT_MAX_DELAY_MS = 600;
      const DIRECT_MAX_QUEUE = 120;
      // Compteurs consultables (diagnostic) : images affichées, images en retard.
      window.diffusionStats = { mode: "chargement", drawn: 0, late: 0, delay: DIRECT_DELAY_MS, audio: 0, level: 0 };

      function startDirect() {
        return new Promise(async (resolve) => {
          let settled = false;
          const settle = (ok) => {
            if (!settled) resolve(ok);
            settled = true;
          };
          const mode = new URLSearchParams(location.search).get("mode");
          if (mode === "mse" || !("VideoDecoder" in window) || !("AudioDecoder" in window)) return settle(false);

          const canvas = document.getElementById("canvas");
          const ctx = canvas.getContext("2d", { alpha: false });
          const frames = [];
          let decoder = null;
          let waitKey = true;
          let base = null; // heure d'affichage d'une image = horodatage + base
          let delay = DIRECT_DELAY_MS;
          let lastLate = performance.now();
          let lastTs = -Infinity;
          let player = null;
          let audioDecoder = null;
          let audioCtx = null;

          function onFrame(frame) {
            const ts = frame.timestamp / 1000;
            if (ts < lastTs - 1000) base = null; // flux redémarré
            lastTs = ts;
            const now = performance.now();
            if (base === null) base = now + delay - ts;
            // Arrivée en retard : la réserve grandit d'autant (pas de saccade).
            const late = now - (ts + base);
            if (late > 0) {
              window.diffusionStats.late++;
              delay = Math.min(DIRECT_MAX_DELAY_MS, delay + late + 10);
              base += late + 10;
              lastLate = now;
            }
            frames.push(frame);
            while (frames.length > DIRECT_MAX_QUEUE) frames.shift().close();
            if (!settled) {
              window.diffusionStats.mode = "direct";
              video.hidden = true;
              canvas.hidden = false;
              settle(true);
            }
          }

          function render() {
            const now = performance.now();
            let chosen = null;
            while (frames.length && frames[0].timestamp / 1000 + base <= now) {
              if (chosen) chosen.close();
              chosen = frames.shift();
            }
            if (chosen) {
              ctx.drawImage(chosen, 0, 0, canvas.width, canvas.height);
              chosen.close();
              window.diffusionStats.drawn++;
            }
            window.diffusionStats.delay = Math.round(delay);
            // Arrivées régulières depuis un moment : la réserve redescend doucement.
            if (now - lastLate > 3000 && delay > DIRECT_DELAY_MS) {
              delay -= 1;
              base -= 1;
            }
            requestAnimationFrame(render);
          }
          requestAnimationFrame(render);

          async function configureVideo(config) {
            const decoderConfig = {
              codec: config.codec,
              codedWidth: config.width,
              codedHeight: config.height,
              optimizeForLatency: true,
            };
            const support = await VideoDecoder.isConfigSupported(decoderConfig).catch(() => null);
            if (!support || !support.supported) throw new Error("format non pris en charge");
            if (decoder && decoder.state !== "closed") decoder.close();
            decoder = new VideoDecoder({ output: onFrame, error: () => (waitKey = true) });
            decoder.configure(decoderConfig);
            canvas.width = config.width;
            canvas.height = config.height;
            waitKey = true;
          }

          async function configureAudio(config) {
            if (!audioCtx) {
              audioCtx = new AudioContext({ sampleRate: config.sampleRate, latencyHint: "interactive" });
              await audioCtx.audioWorklet.addModule("/pcm-worklet.js");
              player = new AudioWorkletNode(audioCtx, "pcm-player", {
                outputChannelCount: [2],
                processorOptions: { target: DIRECT_DELAY_MS / 1000 },
              });
              player.connect(audioCtx.destination);
              // Navigateur ordinaire : le son démarre au premier clic (OBS : tout de suite).
              document.addEventListener("click", () => audioCtx.resume(), { once: true });
            }
            if (audioDecoder && audioDecoder.state !== "closed") audioDecoder.close();
            audioDecoder = new AudioDecoder({
              output: (data) => {
                const n = data.numberOfFrames;
                const channels = data.numberOfChannels;
                const plane = new Float32Array(n);
                const out = new Float32Array(n * 2);
                for (let c = 0; c < 2; c++) {
                  data.copyTo(plane, { planeIndex: Math.min(c, channels - 1), format: "f32-planar" });
                  for (let i = 0; i < n; i++) out[i * 2 + c] = plane[i];
                }
                data.close();
                window.diffusionStats.audio++;
                let peak = 0;
                for (let i = 0; i < out.length; i += 16) peak = Math.max(peak, Math.abs(out[i]));
                // Niveau du son (crête, en %), qui redescend doucement.
                const stats = window.diffusionStats;
                stats.level = Math.max(Math.round(peak * 100), Math.round(stats.level * 0.95));
                player.port.postMessage(out, [out.buffer]);
              },
              error: () => {},
            });
            audioDecoder.configure({
              codec: config.codec,
              sampleRate: config.sampleRate,
              numberOfChannels: config.numberOfChannels,
            });
            audioCtx.resume().catch(() => {});
          }

          async function handle(type, key, timestamp, payload) {
            if (type === 1) return configureVideo(JSON.parse(new TextDecoder().decode(payload)));
            if (type === 3) return configureAudio(JSON.parse(new TextDecoder().decode(payload)));
            if (type === 2 && decoder && decoder.state === "configured") {
              if (waitKey && !key) return;
              // Décodeur débordé : on reprend à la prochaine image clé.
              if (decoder.decodeQueueSize > 10) {
                waitKey = true;
                return;
              }
              waitKey = false;
              decoder.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp, data: payload }));
            }
            if (type === 4 && audioDecoder && audioDecoder.state === "configured") {
              audioDecoder.decode(new EncodedAudioChunk({ type: "key", timestamp, data: payload }));
            }
          }

          try {
            const response = await fetch("/direct", { cache: "no-store" });
            const reader = response.body.getReader();
            let pending = new Uint8Array(0);
            for (;;) {
              const { value, done } = await reader.read();
              if (done) break;
              const joined = new Uint8Array(pending.length + value.length);
              joined.set(pending);
              joined.set(value, pending.length);
              pending = joined;
              let offset = 0;
              while (pending.length - offset >= 14) {
                const view = new DataView(pending.buffer, pending.byteOffset + offset, 14);
                const length = view.getUint32(10, true);
                if (pending.length - offset - 14 < length) break;
                const payload = pending.subarray(offset + 14, offset + 14 + length);
                await handle(view.getUint8(0), view.getUint8(1) === 1, view.getFloat64(2, true), payload);
                offset += 14 + length;
              }
              pending = pending.slice(offset);
            }
          } catch {
            // Format non lisible ici, ou application fermée.
            settle(false);
            return;
          }
          // Flux coupé : on se reconnecte dès que l'application répond.
          settle(true);
          streamEnded = true;
        });
      }

      startDirect().then((ok) => {
        if (ok) return;
        window.diffusionStats.mode = "mse";
        start();
      });
    </script>
  </body>
</html>
