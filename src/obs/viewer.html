<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Diffusion Écran — OBS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
    </style>
  </head>
  <body>
    <img id="flux" src="/flux.mjpg" alt="" />
    <script>
      // Si l'application redémarre, on se reconnecte tout seul.
      const img = document.getElementById("flux");
      img.addEventListener("error", () =>
        setTimeout(() => (img.src = "/flux.mjpg?" + Date.now()), 1000)
      );
    </script>
  </body>
</html>
